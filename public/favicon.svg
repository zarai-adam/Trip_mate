<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="sig" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#B2D8B2"/>
      <stop offset="50%" stop-color="#8FC08F"/>
      <stop offset="100%" stop-color="#7AB37A"/>
    </linearGradient>
  </defs>
  <!-- Beautiful signature gradient rounded rectangle -->
  <rect width="512" height="512" rx="128" fill="url(#sig)"/>
  
  <g transform="translate(256, 256)">
    <!-- Outer Compass Circle -->
    <circle r="140" stroke="white" stroke-width="26" fill="none" />
    
    <!-- Tiny tick marks for compass rose -->
    <line x1="0" y1="-140" x2="0" y2="-120" stroke="white" stroke-width="12" stroke-linecap="round" />
    <line x1="0" y1="120" x2="0" y2="140" stroke="white" stroke-width="12" stroke-linecap="round" />
    <line x1="-140" y1="0" x2="-120" y2="0" stroke="white" stroke-width="12" stroke-linecap="round" />
    <line x1="120" y1="0" x2="140" y2="0" stroke="white" stroke-width="12" stroke-linecap="round" />
    
    <!-- Compass needle pointing Northeast -->
    <polygon points="85,-85 30,30 -85,85 -30,-30" fill="white" stroke="white" stroke-width="12" stroke-linejoin="round" />
    
    <!-- Center pivot screw -->
    <circle cx="0" cy="0" r="16" fill="#7AB37A" stroke="white" stroke-width="8" />
  </g>
</svg>
